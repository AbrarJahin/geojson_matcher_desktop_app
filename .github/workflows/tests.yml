name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_ADDOPTS: "--tb=long -ra"

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee system-deps.log
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            2>&1 | tee -a system-deps.log

          echo
          echo "Relevant graphics libraries available to the runner:"
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' | tee -a system-deps.log

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: true
          miniconda-version: latest

      - name: Verify Conda command
        run: |
          set -euo pipefail
          echo "setup-miniconda installation root: ${CONDA:-<not-set>}"
          echo "Make will explicitly use the conda executable from PATH."
          command -v conda
          conda --version

      - name: Set up project environment
        run: |
          set -euo pipefail
          make setup CONDA=conda 2>&1 | tee setup.log

      - name: Run complete unit test suite
        run: |
          set -euo pipefail
          make test CONDA=conda 2>&1 | tee pytest.log

      - name: Upload diagnostic logs after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-${{ github.run_id }}
          path: |
            system-deps.log
            setup.log
            pytest.log
          if-no-files-found: ignore
          retention-days: 14
