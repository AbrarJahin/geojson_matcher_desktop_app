name: Manual Cross-Platform Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Verify master tests and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}

    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Read version and Git revision
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          MASTER_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${MASTER_SHA:0:4}"
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('pyproject.toml').open('rb') as stream:
              data = tomllib.load(stream)
          print(data['project']['version'])
          PY
          )"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: pyproject.toml version must use X.Y.Z format; found '$VERSION'." >&2
            exit 1
          fi

          RELEASE_TAG="v${VERSION}+${SHORT_SHA}"
          RELEASE_TITLE="Road Matcher ${VERSION} (${SHORT_SHA})"

          echo "sha=${MASTER_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          echo "Master SHA:    ${MASTER_SHA}"
          echo "Version:       ${VERSION}"
          echo "Release tag:   ${RELEASE_TAG}"

      - name: Require successful Tests workflow for this exact master commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail

          RUNS_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?branch=master&head_sha=${MASTER_SHA}&status=completed&per_page=20")"

          LATEST_CONCLUSION="$(printf '%s' "$RUNS_JSON" | jq -r \
            '.workflow_runs | sort_by(.run_number) | last | .conclusion // ""')"

          if [[ -z "$LATEST_CONCLUSION" ]]; then
            echo "ERROR: No completed Tests workflow was found for master commit ${MASTER_SHA}." >&2
            echo "Wait for the master Tests workflow to finish successfully, then run this release workflow again." >&2
            exit 1
          fi

          if [[ "$LATEST_CONCLUSION" != "success" ]]; then
            echo "ERROR: The latest Tests workflow for master commit ${MASTER_SHA} concluded '${LATEST_CONCLUSION}', not 'success'." >&2
            echo "No release will be built or published." >&2
            exit 1
          fi

          echo "Master unit-test gate passed for ${MASTER_SHA}."

  build:
    name: Build ${{ matrix.label }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            label: Windows x64
            asset_label: Windows-x64
            asset_extension: .exe
          - os: ubuntu-24.04
            platform: linux
            label: Ubuntu x64
            asset_label: Ubuntu-x64
            asset_extension: .tar.gz
          - os: macos-15
            platform: macos
            label: macOS Apple Silicon
            asset_label: macOS-arm64
            asset_extension: .tar.gz
          - os: macos-15-intel
            platform: macos
            label: macOS Intel
            asset_label: macOS-x64
            asset_extension: .tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      PROJECT_VERSION: ${{ needs.gate.outputs.version }}
      SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
      ASSET_NAME: RoadMatcher-${{ matrix.asset_label }}-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}${{ matrix.asset_extension }}

    steps:
      - name: Check out tested master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install Linux Qt runtime libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: true
          miniconda-version: latest

      - name: Pin Linux packaging Python for Expat compatibility
        if: matrix.platform == 'linux'
        shell: bash -el {0}
        run: |
          set -euo pipefail

          # Python 3.12.14 from the current Conda defaults expects a newer
          # Expat symbol than Ubuntu 24.04 provides when the one-file bundle
          # resolves pyexpat. Keep the project on supported Python 3.12, but
          # use the last known-compatible patch release for this Linux bundle.
          conda create --yes \
            --prefix "$GITHUB_WORKSPACE/.venv" \
            python=3.12.9 \
            pip

          "$GITHUB_WORKSPACE/.venv/bin/python" -c \
            "import sys, xml.parsers.expat; print(sys.version); print('pyexpat import passed')"

      - name: Install Windows release tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install make innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          make --version

      - name: Synchronize build version from pyproject metadata
        shell: python
        env:
          PROJECT_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ['PROJECT_VERSION']

          def replace_once(path_text, pattern, replacement):
              path = Path(path_text)
              source = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise RuntimeError(f'Could not synchronize version in {path}.')
              path.write_text(updated, encoding='utf-8')

          replace_once(
              'app/__init__.py',
              r'__version__\s*=\s*"[^"]+"',
              f'__version__ = "{version}"',
          )
          replace_once(
              'installer/RoadMatcher.iss',
              r'#define MyAppVersion\s+"[^"]+"',
              f'#define MyAppVersion "{version}"',
          )
          replace_once(
              'scripts/project_tasks.py',
              r'RoadMatcher-Setup-\d+\.\d+\.\d+\.exe',
              f'RoadMatcher-Setup-{version}.exe',
          )

          print(f'Build-time version synchronized to {version}.')

      - name: Set up project environment on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & make setup CONDA=conda 2>&1 | Tee-Object -FilePath release-setup.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Set up project environment on Unix
        if: matrix.platform != 'windows'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          make setup CONDA=conda 2>&1 | tee release-setup.log

      - name: Test, build, smoke-test, and create Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & make publish CONDA=conda 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone Ubuntu/macOS application
        if: matrix.platform != 'windows'
        shell: bash -el {0}
        run: |
          set -euo pipefail

          # The gate already requires the exact master commit to have a
          # successful complete Tests workflow. Do not rerun the same GUI test
          # suite here; on slower GUI runners, real-time QTimer scheduling can
          # make timing assertions flaky even though the tested commit passed.
          "$GITHUB_WORKSPACE/.venv/bin/python" -m PyInstaller \
            --noconfirm \
            --clean \
            "$GITHUB_WORKSPACE/road_matcher.spec" \
            2>&1 | tee build.log

          if [[ ! -f dist/RoadMatcher ]]; then
            echo "ERROR: PyInstaller finished but dist/RoadMatcher was not created." >&2
            exit 1
          fi

      - name: Run frozen GIS smoke test on Ubuntu/macOS
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f build/packaging-smoke-test.log

          # Run the produced artifact itself after packaging. This keeps the
          # release fail-closed for Pyogrio/GDAL, PyProj, Shapely and the
          # Python runtime/native-library bundle.
          set +e
          ROAD_MATCHER_PACKAGING_SMOKE_REPORT="$GITHUB_WORKSPACE/build/packaging-smoke-test.log" \
            "$GITHUB_WORKSPACE/dist/RoadMatcher" --packaging-smoke-test
          smoke_status=$?
          set -e

          if [[ $smoke_status -ne 0 ]]; then
            echo "ERROR: Frozen GIS smoke test failed with exit code $smoke_status." >&2
            if [[ -f build/packaging-smoke-test.log ]]; then
              echo "----- frozen smoke traceback -----" >&2
              cat build/packaging-smoke-test.log >&2
            fi
            exit "$smoke_status"
          fi

          echo "Frozen GIS dependency smoke test passed."

      - name: Prepare Windows release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release_asset | Out-Null

          $source = "installer_output/RoadMatcher-Setup-$env:PROJECT_VERSION.exe"
          if (-not (Test-Path $source -PathType Leaf)) {
            throw "Expected Windows installer was not created: $source"
          }

          Copy-Item $source "release_asset/$env:ASSET_NAME" -Force
          Write-Host "Prepared release_asset/$env:ASSET_NAME"

      - name: Prepare Ubuntu/macOS release asset
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_asset

          tar -czf "release_asset/${ASSET_NAME}" -C dist RoadMatcher
          echo "Prepared release_asset/${ASSET_NAME}"

      - name: Upload platform asset for release job
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_label }}
          path: release_asset/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs-${{ matrix.asset_label }}-${{ github.run_id }}
          path: |
            release-setup.log
            build.log
            build/packaging-smoke-test.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - gate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download all successful platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_ASSETS=(
            "RoadMatcher-Windows-x64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.exe"
            "RoadMatcher-Ubuntu-x64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.tar.gz"
            "RoadMatcher-macOS-arm64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.tar.gz"
            "RoadMatcher-macOS-x64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.tar.gz"
          )

          for asset in "${EXPECTED_ASSETS[@]}"; do
            if [[ ! -f "release-assets/${asset}" ]]; then
              echo "ERROR: Required release asset is missing: ${asset}" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum RoadMatcher-* > SHA256SUMS.txt
          )

          echo "Release assets:"
          ls -lh release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.gate.outputs.release_title }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --draft
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          echo "Published cross-platform release: $RELEASE_TAG"
