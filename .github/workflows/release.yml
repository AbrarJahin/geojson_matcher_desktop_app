name: Manual Cross-Platform Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Verify master tests and read release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      version: ${{ steps.metadata.outputs.version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}

    steps:
      - name: Check out current master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Read version and Git revision
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          MASTER_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${MASTER_SHA:0:4}"
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as stream:
              data = tomllib.load(stream)
          print(data["project"]["version"])
          PY
          )"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: pyproject.toml version must use X.Y.Z format; found '$VERSION'." >&2
            exit 1
          fi

          RELEASE_TAG="v${VERSION}+${SHORT_SHA}"
          RELEASE_TITLE="Road Matcher ${VERSION} (${SHORT_SHA})"

          echo "sha=${MASTER_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          echo "Master SHA:  ${MASTER_SHA}"
          echo "Version:     ${VERSION}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Require successful Tests workflow for this exact master commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail

          RUNS_JSON="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?branch=master&head_sha=${MASTER_SHA}&status=completed&per_page=20")"

          LATEST_CONCLUSION="$(printf "%s" "$RUNS_JSON" | jq -r \
            '.workflow_runs | sort_by(.run_number) | last | .conclusion // ""')"

          if [[ -z "$LATEST_CONCLUSION" ]]; then
            echo "ERROR: No completed Tests workflow was found for master commit ${MASTER_SHA}." >&2
            echo "Wait for the master Tests workflow to finish successfully, then run this release workflow again." >&2
            exit 1
          fi

          if [[ "$LATEST_CONCLUSION" != "success" ]]; then
            echo "ERROR: The latest Tests workflow for master commit ${MASTER_SHA} concluded '${LATEST_CONCLUSION}', not 'success'." >&2
            echo "No release will be built or published." >&2
            exit 1
          fi

          echo "Master unit-test gate passed for ${MASTER_SHA}."

  build:
    name: Build ${{ matrix.label }} · v${{ needs.gate.outputs.version }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            label: Windows x86-64
            asset_label: Windows-x86_64
            asset_extension: .exe

          - os: ubuntu-24.04
            platform: linux
            label: Ubuntu x86-64
            asset_label: Ubuntu-x86_64
            asset_extension: .deb

          - os: macos-15
            platform: macos
            label: macOS Apple Silicon
            asset_label: macOS-arm64
            asset_extension: .dmg

          - os: macos-15-intel
            platform: macos
            label: macOS Intel x86-64
            asset_label: macOS-x86_64
            asset_extension: .dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      PROJECT_VERSION: ${{ needs.gate.outputs.version }}
      SHORT_SHA: ${{ needs.gate.outputs.short_sha }}
      ASSET_NAME: RoadMatcher-${{ matrix.asset_label }}-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}${{ matrix.asset_extension }}

    steps:
      - name: Check out tested master commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Show release metadata
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          echo "Road Matcher version: ${PROJECT_VERSION}"
          echo "Git revision:         ${SHORT_SHA}"
          echo "Release asset:        ${ASSET_NAME}"

      - name: Show release metadata
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "Road Matcher version: $env:PROJECT_VERSION"
          Write-Host "Git revision:         $env:SHORT_SHA"
          Write-Host "Release asset:        $env:ASSET_NAME"

      - name: Install Linux Qt runtime libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: ""
          auto-activate: true
          miniconda-version: latest

      - name: Install Windows release tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install make innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          make --version

      - name: Set up project environment on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & make setup CONDA=conda 2>&1 |
            Tee-Object -FilePath release-setup.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Set up project environment on Unix
        if: matrix.platform != 'windows'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          make setup CONDA=conda 2>&1 | tee release-setup.log

      - name: Test, build, smoke-test, and create Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & make publish CONDA=conda 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone Ubuntu/macOS application
        if: matrix.platform != 'windows'
        shell: bash -el {0}
        run: |
          set -euo pipefail

          # The gate already requires this exact master commit to have a
          # successful complete Tests workflow. Package that tested revision
          # without rerunning timing-sensitive GUI tests on release runners.
          "$GITHUB_WORKSPACE/.venv/bin/python" -m PyInstaller \
            --noconfirm \
            --clean \
            "$GITHUB_WORKSPACE/road_matcher.spec" \
            2>&1 | tee build.log

          if [[ "${{ matrix.platform }}" == "linux" && ! -f dist/RoadMatcher ]]; then
            echo "ERROR: PyInstaller finished but dist/RoadMatcher was not created." >&2
            exit 1
          fi

          if [[ "${{ matrix.platform }}" == "macos" && ! -d "dist/Road Matcher.app" ]]; then
            echo "ERROR: PyInstaller finished but dist/Road Matcher.app was not created." >&2
            exit 1
          fi

      - name: Run frozen GIS smoke test on Ubuntu
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f build/packaging-smoke-test.log

          set +e
          ROAD_MATCHER_PACKAGING_SMOKE_REPORT="$GITHUB_WORKSPACE/build/packaging-smoke-test.log" \
            "$GITHUB_WORKSPACE/dist/RoadMatcher" --packaging-smoke-test
          smoke_status=$?
          set -e

          if [[ $smoke_status -ne 0 ]]; then
            echo "ERROR: Frozen Ubuntu GIS smoke test failed with exit code $smoke_status." >&2
            if [[ -f build/packaging-smoke-test.log ]]; then
              echo "----- frozen smoke traceback -----" >&2
              cat build/packaging-smoke-test.log >&2
            fi
            exit "$smoke_status"
          fi

          echo "Frozen Ubuntu GIS dependency smoke test passed."

      - name: Run frozen GIS smoke test on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          rm -f build/packaging-smoke-test.log

          APP_EXE="$GITHUB_WORKSPACE/dist/Road Matcher.app/Contents/MacOS/RoadMatcher"
          if [[ ! -x "$APP_EXE" ]]; then
            echo "ERROR: macOS app executable was not found: $APP_EXE" >&2
            exit 1
          fi

          set +e
          ROAD_MATCHER_PACKAGING_SMOKE_REPORT="$GITHUB_WORKSPACE/build/packaging-smoke-test.log" \
            "$APP_EXE" --packaging-smoke-test
          smoke_status=$?
          set -e

          if [[ $smoke_status -ne 0 ]]; then
            echo "ERROR: Frozen macOS GIS smoke test failed with exit code $smoke_status." >&2
            if [[ -f build/packaging-smoke-test.log ]]; then
              echo "----- frozen smoke traceback -----" >&2
              cat build/packaging-smoke-test.log >&2
            fi
            exit "$smoke_status"
          fi

          echo "Frozen macOS GIS dependency smoke test passed."

      - name: Prepare Windows installer asset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release_asset | Out-Null

          $source = "installer_output/RoadMatcher-Setup-$env:PROJECT_VERSION.exe"
          if (-not (Test-Path $source -PathType Leaf)) {
            throw "Expected Windows installer was not created: $source"
          }

          Copy-Item $source "release_asset/$env:ASSET_NAME" -Force
          Write-Host "Prepared release_asset/$env:ASSET_NAME"

      - name: Create Ubuntu DEB installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_ROOT="$RUNNER_TEMP/road-matcher-deb"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p \
            "$PACKAGE_ROOT/DEBIAN" \
            "$PACKAGE_ROOT/opt/road-matcher" \
            "$PACKAGE_ROOT/usr/bin" \
            "$PACKAGE_ROOT/usr/share/applications" \
            "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps" \
            release_asset

          install -m 0755 \
            "$GITHUB_WORKSPACE/dist/RoadMatcher" \
            "$PACKAGE_ROOT/opt/road-matcher/RoadMatcher"

          install -m 0644 \
            "$GITHUB_WORKSPACE/app/resources/road_matcher.png" \
            "$PACKAGE_ROOT/usr/share/icons/hicolor/256x256/apps/road-matcher.png"

          ln -s /opt/road-matcher/RoadMatcher \
            "$PACKAGE_ROOT/usr/bin/road-matcher"

          cat > "$PACKAGE_ROOT/usr/share/applications/road-matcher.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Road Matcher
          Comment=Road junction verification for two GeoJSON road datasets
          Exec=/opt/road-matcher/RoadMatcher
          Icon=road-matcher
          Terminal=false
          Categories=Science;Utility;
          EOF

          cat > "$PACKAGE_ROOT/DEBIAN/control" <<EOF
          Package: road-matcher
          Version: ${PROJECT_VERSION}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: Abrar Jahin
          Depends: libegl1, libgl1, libxkbcommon-x11-0, libxcb-cursor0, libxcb-xinerama0, libdbus-1-3, libfontconfig1, libfreetype6, libx11-6, libx11-xcb1, libxcb1, libxext6, libxrender1
          Description: Road Matcher Desktop
           Desktop road junction verification and GeoJSON matching application.
          EOF

          dpkg-deb --build --root-owner-group \
            "$PACKAGE_ROOT" \
            "release_asset/${ASSET_NAME}"

          dpkg-deb --info "release_asset/${ASSET_NAME}"
          echo "Prepared release_asset/${ASSET_NAME}"

      - name: Create macOS DMG installer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          APP_BUNDLE="$GITHUB_WORKSPACE/dist/Road Matcher.app"
          DMG_ROOT="$RUNNER_TEMP/road-matcher-dmg"

          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT" release_asset

          echo "Disk space before macOS packaging cleanup:"
          df -h /

          # The .app has already passed the frozen GIS smoke test. These are
          # build-only files and can be removed before hdiutil creates another
          # filesystem image. This avoids disk exhaustion on the smaller Intel
          # macOS hosted runner.
          rm -rf \
            "$GITHUB_WORKSPACE/.venv" \
            "$GITHUB_WORKSPACE/build" \
            "$HOME/Library/Caches/pip" \
            "$HOME/Library/Application Support/pyinstaller"

          # ditto preserves the macOS application bundle structure.
          ditto "$APP_BUNDLE" "$DMG_ROOT/Road Matcher.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          # The complete staged .app now lives under RUNNER_TEMP, so the
          # original PyInstaller dist tree is no longer needed.
          rm -rf "$GITHUB_WORKSPACE/dist"

          echo "Disk space after macOS packaging cleanup:"
          df -h /

          hdiutil create \
            -volname "Road Matcher ${PROJECT_VERSION}" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "release_asset/${ASSET_NAME}"

          hdiutil imageinfo "release_asset/${ASSET_NAME}" >/dev/null
          echo "Prepared release_asset/${ASSET_NAME}"

      - name: Upload platform installer for release job
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_label }}
          path: release_asset/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-logs-${{ matrix.asset_label }}-${{ github.run_id }}
          path: |
            release-setup.log
            build.log
            build/packaging-smoke-test.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release · v${{ needs.gate.outputs.version }}
    needs:
      - gate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download all successful platform installers
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify installers and create checksums
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_ASSETS=(
            "RoadMatcher-Windows-x86_64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.exe"
            "RoadMatcher-Ubuntu-x86_64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.deb"
            "RoadMatcher-macOS-arm64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.dmg"
            "RoadMatcher-macOS-x86_64-${{ needs.gate.outputs.version }}-${{ needs.gate.outputs.short_sha }}.dmg"
          )

          for asset in "${EXPECTED_ASSETS[@]}"; do
            if [[ ! -f "release-assets/${asset}" ]]; then
              echo "ERROR: Required release installer is missing: ${asset}" >&2
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum RoadMatcher-* > SHA256SUMS.txt
          )

          echo "Release installers for Road Matcher ${{ needs.gate.outputs.version }}:"
          ls -lh release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.gate.outputs.release_title }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --draft
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          echo "Published Road Matcher ${{ needs.gate.outputs.version }}: $RELEASE_TAG"
