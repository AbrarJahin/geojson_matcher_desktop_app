[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-matcher-desktop"
version = "1.3.0"
description = "Desktop conversion of the two-GeoJSON road matching notebook"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6>=6.10,<7",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "pyogrio>=0.9,<1",
  "scikit-learn>=1.5,<2",
  "threadpoolctl>=3.5,<4",
  "rapidfuzz>=3.9,<4",
  "scipy>=1.12,<2",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/test_legacy_program.py"
